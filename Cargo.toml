[package]
name = "thalamic-relay"
version = "0.1.0"
edition = "2024"
description = "Lightweight CLI relay that observes telemetry and forwards normalized stimuli to FPGA/network backends."
license = "MIT OR Apache-2.0"

[dependencies]
# Core Logic
anyhow = "1"
neuromod = "0.4.0"
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
clap = { version = "4.2.4", features = ["derive", "env"] }
lazy_static = "1.4"

# Hardware Interfaces
nvml-wrapper = "0.10"
nix = { version = "0.29", features = ["signal", "process"] }
rand = "0.8"

silicon-bridge = { path = "../silicon-bridge", features = ["uart"] }

[[bin]]
name = "thalamic-relay"
path = "src/main.rs"

[workspace]
