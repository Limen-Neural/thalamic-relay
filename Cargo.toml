[package]
name = "thalamic-relay"
version = "0.1.0"
edition = "2024"
description = "Lightweight CLI relay that observes telemetry and forwards normalized stimuli to SNN (software-only, no built-in FPGA bridge)."
license = "MIT OR Apache-2.0"

[dependencies]
# Core Logic
neuromod = "0.4.0"
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
lazy_static = "1.4"

# Hardware Interfaces
nvml-wrapper = "0.10"

[[bin]]
name = "thalamic-relay"
path = "src/main.rs"

[workspace]
