name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The serial backend (serialport -> libudev-sys) needs the libudev
      # development headers and pkg-config to build.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev

      # thalamic-relay depends on sibling crates via `../` path dependencies in
      # Cargo.toml, so they must be checked out next to this repo before any
      # cargo command (cargo metadata/fmt/clippy/build all need their manifests).
      - name: Fetch workspace path dependencies
        working-directory: ..
        run: |
          for repo in silicon-bridge plasticity-lab metabolic-ledger limbic-critic; do
            if [ ! -d "$repo" ]; then
              git clone --depth 1 "https://github.com/Limen-Neural/$repo" "$repo"
            fi
          done

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (lint)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-features

      - name: Test
        run: cargo test --all-features
