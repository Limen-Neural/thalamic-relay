name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # The serial backend (serialport -> libudev-sys) needs the libudev
      # development headers and pkg-config to build.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev

      # thalamic-relay depends on sibling crates via `../` path dependencies in
      # Cargo.toml, so they must be checked out next to this repo before any
      # cargo command (cargo metadata/fmt/clippy/build all need their manifests).
      - name: Fetch workspace path dependencies
        working-directory: ..
        run: |
          for repo in silicon-bridge plasticity-lab metabolic-ledger limbic-critic; do
            if [ ! -d "$repo" ]; then
              git clone --depth 1 "https://github.com/Limen-Neural/$repo" "$repo"
            fi
          done

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (lint)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-features

      - name: Test
        run: cargo test --all-features
